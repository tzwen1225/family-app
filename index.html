<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>鍾家大宅</title>
  <meta name="theme-color" content="#F6F8F4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="鍾家大宅">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <!-- 先套用這支手機選的面板顏色，避免畫面先閃一下預設色 -->
  <script>try { var t = localStorage.getItem('family-theme'); if (localStorage.getItem('family-auto-night') === '1' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) t = 'night'; if (t) document.documentElement.dataset.theme = t; var s = localStorage.getItem('family-style'); if (s) document.documentElement.dataset.style = s; document.documentElement.dataset.icons = localStorage.getItem('family-icon-style') === '3d' ? '3d' : 'vec'; } catch (e) { document.documentElement.dataset.icons = 'vec'; }</script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app"><div class="splash"><div class="login-mark" aria-hidden="true">家</div><p>鍾家大宅</p></div></div>
  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="vendor/firebase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/holidays.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
