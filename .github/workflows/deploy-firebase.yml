# 用手機部署 Firebase：雲端函式（推播、AI、交通、提醒）和資料庫安全規則。跟 deploy.bat 做的事一樣。
# 不會自動跑：要在 GitHub（App 或網頁）的 Actions →「部署 Firebase」按「Run workflow」才會部署。
# 需要先在 GitHub 的 Settings → Secrets and variables → Actions 新增一個 secret：
#   FIREBASE_SERVICE_ACCOUNT ＝ Google Cloud 服務帳戶的 JSON 金鑰（整份內容貼上）
# 金鑰只存在 GitHub 的 secret 裡，不會出現在程式碼或執行紀錄中。
name: 部署 Firebase（雲端函式和安全規則）

on:
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 檢查金鑰
        id: key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::還沒設定 FIREBASE_SERVICE_ACCOUNT（Settings → Secrets and variables → Actions），沒辦法部署。"
            exit 1
          else
            printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.key.outputs.ok == '1'
        with:
          node-version: 22

      - name: 安裝雲端函式需要的套件
        if: steps.key.outputs.ok == '1'
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: 部署
        if: steps.key.outputs.ok == '1'
        run: |
          echo "版本：$(cat version.txt)"
          npx --yes firebase-tools@latest deploy --only functions,firestore:rules --project chuang-e5b8e --non-interactive --force

      - name: 清掉金鑰檔
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
